name: Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shellcheck and tests
        run: bin/test

  deploy:
    name: Deploy to server
    needs: check
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 20
    # Queued rather than cancelled, so a merge never kills a deploy partway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # The key's forced command decides what runs on the server, so this only
      # names the commit that passed the checks. HostKeyAlias pins the server's
      # key whichever host and port reach it.
      - name: Run the deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          printf 'homeserver %s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o HostKeyAlias=homeserver -o StrictHostKeyChecking=yes \
            "deployer@$SSH_HOST" "$GITHUB_SHA"
